[[action]]
name = "backup-all"
tags = ["komodo-backup"]
[action.config]
webhook_enabled = false
file_contents = """
const stacks = await komodo.read('ListStacks', {})
// List servers to match server ids with names
const servers = (await komodo.read('ListServers', {})).reduce((map, server) => {
  map[server.id] = server.name;
  return map;
}, {});
// Id of skip tag
const skipTag = (await komodo.read('GetTag', {tag: "backup.skip"}))._id.$oid
const failures: string[] = []
const successes: string[] = []

// beforeCommands
for (const server in servers) {
  await executeCommands(servers[server], "beforeCommands")
}

// backupCommands
for (const stack of stacks) {
  if (stack.tags.includes(skipTag)) {
    console.log('Skipping stack', stack.name)
    continue
  }

  console.log('Start backup of stack', stack.name)
  for (const service of stack.info.services) {
    try {
      const container = await komodo.read('InspectStackContainer', {'stack': stack.id, 'service': service.service})
      console.log('Process container', container.Name)

      const serverName = servers[stack.info.server_id]
  
      // Backup volumes
      const labels = container.Config.Labels
      const skipMounts = labels['komodo.backup.skipMounts']?.split(',') || []
      skipMounts.push(getArg(serverName, "ignore") as string)
      for (const mount of container.Mounts) {
        if (skipMounts.some(skip => mount.Source.startsWith(skip)) || mount.Type === "volume") {
          console.log('Skipping volume', mount.Source)
          continue
        }

        console.log('Start backup of volume', mount.Source)
        const success = await executeCommands(serverName, "backupCommands", mount.Source, false)
        if (success) {
          successes.push(servers[stack.info.server_id] + ":" + mount.Source)
        }
      }
    } catch (e) {
      console.error('Error on stack', stack.name)
      failures.push(stack.name)
    }
  }
}

// afterCommands
for (const server in servers) {
  await executeCommands(servers[server], "afterCommands")
}

if (successes.length !== 0) {
  console.log("Backed up:\n", successes.join('\n'))
}


if (failures.length !== 0) {
  console.error("Failed commands:", failures)
  throw new Error(`Failed commands: ${failures}`)
}

function getArg(server: string, argKey: string): unknown {
  const serverConfig = ARGS.servers[server];
  if (!serverConfig) return undefined
  if (argKey in serverConfig) {
    return serverConfig[argKey]
  }
  return ARGS["default"][argKey]
}

async function executeCommands(server, cmdKey, additionalArg = null, direct = true) {
  const commands = getArg(server, cmdKey) as [string]
  if (!commands) return false

  let success = true

  for (const command of commands) {
    const args = { 
      stack: getArg(server, "stack"), 
      service: getArg(server, "service"), 
      command: additionalArg ? [...command, additionalArg] : command 
    }

    const result = await komodo.execute_and_poll(
      direct ? 'RunStackService' : 'RunAction',
      direct ? args : { action: 'backup-one', args: args }
    )

    success &&= result.success

    if (!result.success) failures.push(`${server} - ${cmdKey}`)

    printLogs(result.logs, !result.success)
  }

  return success
}

function printLogs(logs, error) {
  logs.forEach(({ start_ts, stage, stderr, stdout }) => {
    const prefix = `[${new Date(start_ts).toLocaleString()}] [${stage}]`;
    const output = `${stderr}${stdout}`;

    (error ? console.error : console.log)(prefix);
    (error ? console.error : console.log)(output);
  });
}
"""
arguments_format = "json"
arguments = """
{
  "default": {
    "service": "storage-box",
    "beforeCommands" : [
      ["unlock"]
    ],
    "afterCommands": [
      ["forget", "--prune", "--keep-within", "14d", "--keep-weekly", "4", "--keep-monthly", "3"],
      ["forget", "--prune", " --group-by", "", "--keep-within", "6m"],
      ["snapshots"]
    ],
    "ignore": [
      "/usr/share/fonts/"
    ]
  },
  "servers": {
    "beelink": {
      "stack": "backup-beelink",
      "backupCommands": [
        ["backup", "--host", "beelink"]
      ]
    },
    "cloud01": {
      "stack": "backup-cloud01",
      "backupCommands": [
        ["backup", "--host", "cloud01"]
      ]
    }
  }
}
"""

